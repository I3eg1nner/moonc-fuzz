# Two jobs, two questions.
#
# `latest-canary` installs whatever upstream serves and asks "does the harness
# still build on the newest toolchain?" - it is the forward-compat tripwire.
#
# `pinned-evidence` restores the frozen toolchain from the v0.1.0 release asset
# and asks "do the acceptance gates still pass on the version every claim in
# `findings/` is stated against?".  It cannot use the upstream installer:
# cli.moonbitlang.com serves only `latest`, and every versioned path answers
# 403.  That is why the toolchain is archived (findings/toolchain_archive.md).
#
# The pinned job runs `--profile core` (17 of 20 gates).  The three trace gates
# need `afl-qemu-trace` and a symbol table of the pinned `moonc`; they run
# locally, and the JSON names them under `skipped` instead of dropping them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latest-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Verify the interpreter binary is present
        run: moonc -v

      - name: Update registry
        run: moon update

      - name: Check
        working-directory: moonbit
        run: moon check

      - name: Build
        working-directory: moonbit
        run: moon build

      - name: Test
        working-directory: moonbit
        run: moon test

      - name: Format
        working-directory: moonbit
        run: moon fmt --check

      - name: Minimal example
        run: ./examples/trace2funcs.sh

  pinned-evidence:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_SHA256: 4b1aee737cb004df8a220ae6d8fab69646a8a153d72ab969e56735cbae4bee4f
      TOOLCHAIN_ASSET: moonbit-0.1.20261104-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      # `runner` is not an allowed context in job-level `env`, so the path is
      # exported from a step instead.
      - name: Point MOON_HOME at the archive
        run: |
          echo "MOON_HOME=$RUNNER_TEMP/moonbit-pin" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/moonbit-pin"

      - name: Restore the frozen toolchain
        run: |
          set -euo pipefail
          url="https://github.com/I3eg1nner/moonc-fuzz/releases/download/v0.1.0/$TOOLCHAIN_ASSET"
          curl -fsSL -o "$RUNNER_TEMP/toolchain.tar.gz" "$url"
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/toolchain.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$MOON_HOME" --strip-components=1
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Build (pinned)
        working-directory: moonbit
        run: moon build --target native

      - name: Acceptance gates (core profile)
        run: |
          set -euo pipefail
          mkdir -p out
          # `accept` exits 1 when a gate fails; capture that instead of letting
          # `set -e` abort before the report is printed.
          set +e
          ./moonbit/_build/native/debug/build/cmd/accept/accept.exe "$GITHUB_WORKSPACE" \
            --profile core > out/accept.json
          accept_rc=$?
          set -e
          echo "accept rc=$accept_rc"
          python3 - <<'PY'
          import json

          d = json.load(open("out/accept.json"))
          failed = [c["check"] for c in d["checks"] if not c["ok"]]
          print(f"profile={d['profile']} gates={len(d['checks'])} ok={d['ok']}")
          print("skipped:", ", ".join(d["skipped"]) or "(none)")
          for c in d["checks"]:
              print(f"  {'PASS' if c['ok'] else 'FAIL'}  {c['check']:20} {c['detail'][:70]}")
          if not d["ok"] or failed:
              raise SystemExit(f"failed gates: {failed}")
          PY

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-core
          path: out/accept.json
          if-no-files-found: warn
